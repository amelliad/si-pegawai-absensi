<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Sistem Absensi</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="style2.css" />
  </head>
  <body>
    <div class="background"></div>
    <div class="container" id="container">
      <div class="login-form">
        <form id="login-form">
          <h1 id="login-title">Login</h1>
          <div class="social-icons">
            <a href="#" class="icon"><i class="fa-brands fa-google"></i></a>
            <!-- <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#" class="icon"><i class="fa-brands fa-github"></i></a>
            <a href="#" class="icon"><i class="fa-brands fa-instagram"></i></a> -->
          </div>
          <span>atau</span>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="ID/Username"
            required
          />
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            required
          />
          <button type="submit">Login</button>

          <div class="form-group">
            <div id="error-message" class="error-message"></div>
          </div>
        </form>
      </div>
      <div class="toggle-container">
        <div class="toggle">
          <div class="toggle-panel toggle-right">
            <h1>Welcome, Pegawai Hebat!</h1>
            <!-- <h1>Nice To See You</h1> -->
            <p>Untuk pengelolaan lebih lanjut, masuk sebagai admin.</p>
              <button class="hidden" id="admin-toggle">Admin</button>
          </div>

          <a class="toggle-panel toggle-left">
            <h1>Hai Siap Absen Hari ini?</h1>
            <p>Masuk sebagai pegawai untuk melanjutkan.</p>
              <button class="hidden" id="pegawai-toggle">Pegawai</button>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
